<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>iVISION | Agence Marketing Digital Algérie</title>
    <meta name="description" content="iVISION Agency - Votre partenaire croissance en Algérie. Spécialiste en acquisition massive, création de contenu et écosystèmes web haute performance." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        --iv-black: #0f1213;
        --iv-white: #f6f6f6;
        --iv-paper: #f3f3f3;
        --iv-magenta: #ff390c;
        --iv-orange: #ff390c;
        --iv-green: #00674f;
        --iv-line: rgba(246,246,246,0.12);
        --iv-muted: rgba(246,246,246,0.55);
      }

      html, body { background: var(--iv-black); color: var(--iv-white); margin: 0; padding: 0; }
      body { font-family: 'Open Sans', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
      h1, h2, h3, .iv-font-geist { font-family: 'Geist', sans-serif; font-weight: 500; letter-spacing: -0.06em; }

      /* ===== LAYOUT PRIMITIVES ===== */
      .iv-section-topline { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 4.8vw; border-bottom: 1px solid var(--iv-line); color: var(--iv-muted); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
      .iv-label { display: inline-block; margin-bottom: 1.2rem; color: var(--iv-orange); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
      .iv-arrow-link { display: inline-flex; align-items: center; gap: 0.6rem; color: var(--iv-white); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-decoration: none; text-transform: uppercase; }
      .iv-arrow-link b { color: var(--iv-magenta); font-size: 1.1rem; font-weight: 400; transition: transform 0.3s cubic-bezier(0.23,1,0.32,1); }
      .iv-arrow-link:hover b { transform: translate(4px, -4px); }

      /* ===== HERO ===== */
      .iv-hero { position: relative; min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; background: var(--iv-black); }
      .iv-hero-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
      .iv-hero-bg img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center center; filter: saturate(.95) contrast(1.06) brightness(.92); transition: transform 1.2s cubic-bezier(.23,1,.32,1); }
      .iv-hero-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,9,9,.46) 0%, rgba(8,9,9,.12) 56%, rgba(8,9,9,.28) 100%), linear-gradient(0deg, rgba(8,9,9,.52), rgba(8,9,9,.04) 62%, rgba(8,9,9,.24)); }
      .iv-hero-top, .iv-hero-main { position: relative; z-index: 2; }
      .iv-hero-top { display: flex; justify-content: space-between; align-items: center; padding: 7.5rem 4.8vw 0; color: var(--iv-white); }
      .iv-hero-meta { display: flex; align-items: center; gap: 0.8rem; color: rgba(246,246,246,.82); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
      .iv-hero-pulse { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--iv-orange); box-shadow: 0 0 0 0.25rem rgba(255,57,12,0.18); }
      .iv-hero-date { color: rgba(246,246,246,.76); font-size: 0.62rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      .iv-hero-index { color: rgba(246,246,246,.7); font-size: 0.6rem; font-weight: 700; }
      .iv-hero-main { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; padding: clamp(1.5rem, 5vh, 4rem) 4.8vw 2rem; }
      .iv-hero-title-wrap h1 { margin: 0; max-width: 90rem; font-size: clamp(3.3rem, 5.6vw, 7.2rem); line-height: .76; letter-spacing: -.095em; font-weight: 400; text-transform: uppercase; }
      .iv-hero-title-wrap h1 span { display: block; color: var(--iv-white); }
      .iv-hero-title-wrap h1 span:nth-child(2) { margin-left: 12vw; }
      .iv-hero-title-wrap h1 b { color: var(--iv-orange); font-size: .6em; vertical-align: .1em; font-weight: 400; }
      .iv-hero-middle-copy { position: absolute; left: 4.8vw; bottom: 31%; max-width: 8rem; color: rgba(246,246,246,.9); font-size: .48rem; font-weight: 700; letter-spacing: .04em; line-height: 1.2; text-transform: uppercase; }
      .iv-hero-footer { display: flex; justify-content: space-between; align-items: flex-end; gap: 2rem; margin-top: auto; padding-top: clamp(3rem, 8vh, 7rem); }
      .iv-hero-copy { max-width: 20rem; }
      .iv-hero-copy p { max-width: 20rem; margin: 0 0 1.2rem; color: rgba(246,246,246,.78); font-size: .72rem; line-height: 1.4; }
      .iv-hero-actions { display: flex; align-items: center; gap: .7rem; }
      .iv-hero-cta, .iv-hero-scroll { display: inline-flex; align-items: center; gap: .7rem; min-height: 2.7rem; border-radius: 999px; padding: 0 1rem; font: inherit; font-size: .58rem; font-weight: 700; letter-spacing: .08em; text-decoration: none; text-transform: uppercase; cursor: pointer; }
      .iv-hero-cta { border: 0; background: var(--iv-orange); color: #111; }
      .iv-hero-scroll { border: 1px solid rgba(246,246,246,.5); color: var(--iv-white); }
      .iv-hero-cta b, .iv-hero-scroll b { font-size: 1rem; font-weight: 400; }
      .iv-hero-signature { display: inline-flex; align-items: center; align-self: flex-end; gap: .7rem; padding-bottom: .35rem; color: rgba(246,246,246,.78); font-size: .52rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
      .iv-hero-signature i { width: .3rem; height: .3rem; border-radius: 50%; background: var(--iv-orange); }

      .iv-about-trust { display: grid; grid-template-columns: 1fr .8fr; gap: 5vw; align-items: end; padding: 0 4.8vw 3.5rem; }
      .iv-about-trust h3 { max-width: 36rem; margin: 1.3rem 0 0; font-size: clamp(2rem, 4.8vw, 5.5rem); font-weight: 400; letter-spacing: -.08em; line-height: .82; text-transform: uppercase; }
      .iv-about-trust h3 b { display: inline-block; margin-left: .25em; color: var(--iv-orange); font-size: .45em; vertical-align: .2em; font-weight: 400; }
      .iv-about-trust p { max-width: 24rem; margin: 0; color: var(--iv-muted); font-size: .95rem; line-height: 1.5; }
      .iv-about-mosaic { display: grid; grid-template-columns: .65fr 1.15fr .82fr; align-items: end; gap: 1.5rem; padding: 0 4.8vw 5rem; }
      .iv-about-mosaic figure { position: relative; margin: 0; overflow: hidden; border-radius: .7rem; background: #181a18; }
      .iv-about-mosaic figure img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .6s cubic-bezier(.23,1,.32,1); }
      .iv-about-mosaic figure:hover img { transform: scale(1.04); }
      .iv-about-mosaic-small { height: 15rem; }
      .iv-about-mosaic-large { height: 28rem; }
      .iv-about-mosaic-medium { height: 24rem; }
      .iv-about-mosaic figcaption { position: absolute; right: 1rem; bottom: 1rem; left: 1rem; color: var(--iv-white); font-size: .7rem; font-weight: 700; letter-spacing: .08em; line-height: 1.1; text-transform: uppercase; text-shadow: 0 1px 12px rgba(0,0,0,.65); }

      /* ===== ABOUT ===== */
      .iv-about { border-top: 1px solid var(--iv-line); }
      .iv-about-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 5vw; padding: 5.5rem 4.8vw 4.5rem; }
      .iv-about-lead h2 { margin: 0 0 2rem; font-size: clamp(2.1rem, 4.2vw, 4.8rem); line-height: 0.82; text-transform: uppercase; }
      .iv-about-lead p { max-width: 28rem; margin: 0 0 2.5rem; color: var(--iv-muted); font-size: .95rem; line-height: 1.7; }

      .iv-about-side { position: relative; display: flex; flex-direction: column; justify-content: center; }
      .iv-about-orbit { position: absolute; top: 0; right: 0; width: 100%; aspect-ratio: 1; z-index: -1; opacity: 0.4; }
      .iv-about-orbit span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px solid var(--iv-line); border-radius: 50%; }
      .iv-about-orbit span:nth-child(1) { width: 60%; height: 60%; }
      .iv-about-orbit span:nth-child(2) { width: 85%; height: 85%; }
      .iv-about-orbit i { position: absolute; top: 50%; left: 50%; width: 0.5rem; height: 0.5rem; background: var(--iv-magenta); border-radius: 50%; transform: translate(-50%, -50%); }

      .iv-about-side ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2.5rem; }
      .iv-about-side li { display: flex; gap: 1.5rem; align-items: flex-start; }
      .iv-about-side li span { color: var(--iv-magenta); font-family: 'Geist', sans-serif; font-size: 0.8rem; font-weight: 700; margin-top: 0.3rem; }
      .iv-about-side li p { margin: 0; font-size: .98rem; font-weight: 500; line-height: 1.4; }

      /* ===== WORK SCROLL (PORTFOLIO) ===== */
      .iv-work-scroll { position: relative; height: 430vh; background: var(--iv-black); }
      .iv-work-sticky { position: sticky; top: 0; height: 100svh; display: grid; grid-template-rows: auto auto 1fr auto; padding: 7.5rem 4.8vw 2rem; box-sizing: border-box; overflow: hidden; }
      .iv-work-topline { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1rem; color: var(--iv-muted); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
      .iv-work-status { display: flex; align-items: center; gap: 0.6rem; color: var(--iv-white); }
      .iv-work-status i { width: 0.4rem; height: 0.4rem; border-radius: 50%; background: var(--iv-orange); }
      .iv-work-kicker { justify-self: center; opacity: 0.6; }

      .iv-work-heading { margin: 4vh 0 0; }
      .iv-work-heading h2 { margin: 0; font-size: clamp(3.5rem, 9vw, 10rem); line-height: 0.8; text-transform: uppercase; }
      .iv-work-changing-word { color: var(--iv-magenta); display: block; }
      .iv-work-heading p { margin: 1.2rem 0 0; color: var(--iv-muted); font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; }

      .iv-work-stage { display: grid; grid-template-columns: 0.8fr 1.2fr; align-items: center; gap: 6vw; min-height: 0; margin: auto 0; }
      .iv-work-copy { max-width: 26rem; }
      .iv-work-project-index { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem; color: var(--iv-muted); font-size: 0.6rem; font-weight: 700; }
      .iv-work-project-index span:first-child { color: var(--iv-magenta); }
      .iv-work-project-index b { width: 2.5rem; height: 1px; background: var(--iv-line); }
      .iv-work-sector { display: block; margin-bottom: 1rem; color: var(--iv-orange); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
      .iv-work-copy h3 { margin: 0 0 1.2rem; font-size: clamp(2.5rem, 5.5vw, 6rem); line-height: 0.85; text-transform: uppercase; }
      .iv-work-copy p { margin: 0 0 1.8rem; color: var(--iv-muted); font-size: 0.95rem; line-height: 1.6; }
      .iv-work-results { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
      .iv-work-results span { border: 1px solid var(--iv-line); padding: 0.5rem 0.8rem; color: var(--iv-white); font-size: 0.55rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
      .iv-work-actions { display: flex; gap: 1.5rem; }
      .iv-work-link { border: 0; padding: 0; background: transparent; color: var(--iv-white); font: inherit; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-decoration: none; text-transform: uppercase; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
      .iv-work-link b { color: var(--iv-magenta); font-size: 1rem; font-weight: 400; }

      .iv-work-frame { display: block; width: 100%; aspect-ratio: 16 / 10; background: #1c1e1d; border-radius: 0.4rem; overflow: hidden; box-shadow: 0 2rem 5rem rgba(0,0,0,0.4); text-decoration: none; }
      .iv-work-frame-bar { height: 1.8rem; background: #141615; display: flex; align-items: center; padding: 0 0.8rem; gap: 0.3rem; }
      .iv-work-frame-bar span { width: 0.35rem; height: 0.35rem; border-radius: 50%; background: rgba(246,246,246,0.2); }
      .iv-work-frame-bar small { margin-left: auto; color: rgba(246,246,246,0.3); font-size: 0.45rem; letter-spacing: 0.15em; font-weight: 700; }
      .iv-work-frame-image { position: relative; height: calc(100% - 1.8rem); }
      .iv-work-frame-image img { width: 100%; height: 100%; object-fit: cover; }
      .iv-work-frame-caption { position: absolute; bottom: 1rem; right: 1rem; padding: 0.4rem 0.6rem; background: rgba(15,18,19,0.85); color: var(--iv-white); font-size: 0.5rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

      .iv-work-bottomline { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1.5rem; color: var(--iv-muted); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      .iv-work-progress { height: 1px; background: var(--iv-line); overflow: hidden; }
      .iv-work-progress i { display: block; height: 100%; background: var(--iv-magenta); transform-origin: left; transition: transform 0.2s linear; }
      .iv-work-dots { display: flex; gap: 0.4rem; }
      .iv-work-dots i { width: 1.5rem; height: 2px; background: var(--iv-line); transition: all 0.3s ease; }
      .iv-work-dots i.is-active { width: 3rem; background: var(--iv-magenta); }

      /* ===== FIXED CASE STUDIES GRID ===== */
      .iv-work-scene { position: relative; background: var(--iv-black); }
      .iv-work-scene-sticky { box-sizing: border-box; padding: 7.5rem 4.8vw 4.5rem; }
      .iv-work-scene-heading { display: grid; grid-template-columns: 1.05fr .95fr; align-items: end; gap: 6vw; margin: 4rem 0 2.5rem; }
      .iv-work-scene-heading h2 { margin: 1rem 0 0; font-size: clamp(3rem, 7vw, 8rem); line-height: .76; letter-spacing: -.09em; font-weight: 400; text-transform: uppercase; }
      .iv-work-scene-heading h2 span { display: block; }
      .iv-work-scene-heading h2 span:last-child { color: var(--iv-orange); }
      .iv-work-scene-intro { max-width: 22rem; padding-bottom: .3rem; }
      .iv-work-scene-intro p { margin: 0 0 1.7rem; color: var(--iv-muted); font-size: .88rem; line-height: 1.55; }
      .iv-work-marquee { width: 100%; overflow: hidden; margin: 0 auto; }
      .iv-work-marquee-track { display: flex; width: max-content; animation: iv-work-marquee-right 42s linear infinite; will-change: transform; }
      .iv-work-marquee-set { display: flex; flex: 0 0 auto; gap: clamp(1rem, 2vw, 2rem); }
      .iv-work-fixed-card { display: block; flex: 0 0 clamp(18rem, 29vw, 32rem); min-width: 0; color: var(--iv-white); text-decoration: none; }
      .iv-work-fixed-card:hover .iv-work-float-media { border-color: rgba(255,57,12,.8); transform: translateY(-.35rem); }
      .iv-work-float-media { transition: border-color .3s ease, transform .3s ease; }
      .iv-work-float-media { position: relative; overflow: hidden; aspect-ratio: 16 / 10; border: 1px solid rgba(246,246,246,.28); border-radius: .65rem; background: #181a18; box-shadow: 0 1.5rem 4rem rgba(0,0,0,.28); }
      .iv-work-float-media::after { display: none; }
      .iv-work-float-media img { width: 100%; height: 100%; display: block; object-fit: contain; background: #181a18; }
      .iv-work-float-bar { position: absolute; top: 0; right: 0; left: 0; z-index: 1; display: flex; align-items: center; gap: .25rem; height: 1.6rem; padding: 0 .55rem; background: rgba(15,18,19,.72); }
      .iv-work-float-bar span { width: .28rem; height: .28rem; border-radius: 50%; background: rgba(246,246,246,.58); }
      .iv-work-float-bar small { margin-left: auto; color: rgba(246,246,246,.72); font-size: .38rem; font-weight: 700; letter-spacing: .14em; }
      .iv-work-float-meta { padding: .7rem .1rem 0; }
      .iv-work-float-meta > span { display: block; overflow: hidden; color: var(--iv-orange); font-size: .48rem; font-weight: 700; letter-spacing: .11em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
      .iv-work-float-meta strong { display: block; margin: .35rem 0 .3rem; font-size: clamp(.9rem, 1.4vw, 1.35rem); font-weight: 400; line-height: 1; text-transform: uppercase; }
      .iv-work-float-meta small { color: var(--iv-muted); font-size: .5rem; letter-spacing: .1em; text-transform: uppercase; }
      .iv-work-float-meta small b { color: var(--iv-orange); font-size: .9rem; font-weight: 400; }
      .iv-work-scene-footer { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1rem; max-width: 76rem; margin: 3.5rem auto 0; color: var(--iv-muted); font-size: .56rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .iv-work-scene-progress { height: 1px; background: var(--iv-line); }
      .iv-work-scene-progress i { display: block; width: 100%; height: 100%; background: var(--iv-orange); }
      @keyframes iv-work-marquee-right { from { transform: translate3d(-50%, 0, 0); } to { transform: translate3d(0, 0, 0); } }

      /* ===== SIMPLE CASE STUDIES ===== */
      .iv-work-simple { border-top: 1px solid var(--iv-line); padding: 7rem 4.8vw 8rem; }
      .iv-work-simple-heading { display: grid; grid-template-columns: 1.15fr .85fr; align-items: end; gap: 6vw; margin: 5rem 0 4rem; }
      .iv-work-simple-heading h2 { margin: 1rem 0 0; font-size: clamp(4rem, 9vw, 10rem); line-height: .75; letter-spacing: -.09em; font-weight: 400; text-transform: uppercase; }
      .iv-work-simple-heading h2 span { display: block; }
      .iv-work-simple-heading h2 span:last-child { color: var(--iv-orange); white-space: nowrap; }
      .iv-work-simple-intro { max-width: 24rem; padding-bottom: .5rem; }
      .iv-work-simple-intro p { margin: 0 0 2rem; color: var(--iv-muted); font-size: 1rem; line-height: 1.6; }
      .iv-work-simple-cta { display: inline-flex; align-items: center; gap: .7rem; border: 0; border-bottom: 1px solid var(--iv-orange); padding: 0 0 .7rem; background: transparent; color: var(--iv-white); font: inherit; font-size: .62rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
      .iv-work-simple-cta b { color: var(--iv-orange); font-size: 1rem; font-weight: 400; }
      .iv-work-simple-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 1rem; align-items: start; }
      .iv-work-card { min-width: 0; }
      .iv-work-card a { display: block; color: inherit; text-decoration: none; }
      .iv-work-card-media { position: relative; overflow: hidden; aspect-ratio: 1 / 1.08; border-radius: .7rem; background: #181a18; }
      .iv-work-card.is-featured .iv-work-card-media { aspect-ratio: 1.18 / 1; }
      .iv-work-card-media::after { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.58)); content: ''; pointer-events: none; }
      .iv-work-card-media img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .7s cubic-bezier(.23,1,.32,1); }
      .iv-work-card:hover .iv-work-card-media img { transform: scale(1.05); }
      .iv-work-card-bar { position: absolute; top: 0; right: 0; left: 0; z-index: 1; display: flex; align-items: center; gap: .3rem; height: 2rem; padding: 0 .8rem; background: rgba(15,18,19,.74); }
      .iv-work-card-bar span { width: .35rem; height: .35rem; border-radius: 50%; background: rgba(246,246,246,.65); }
      .iv-work-card-bar small { margin-left: auto; color: rgba(246,246,246,.76); font-size: .45rem; font-weight: 700; letter-spacing: .15em; }
      .iv-work-card-meta { padding: 1.2rem 0 2.5rem; }
      .iv-work-card-meta > span { color: var(--iv-orange); font-size: .58rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .iv-work-card-meta h3 { margin: .65rem 0 .45rem; font-size: clamp(1.6rem, 3vw, 3.2rem); line-height: .9; font-weight: 400; text-transform: uppercase; }
      .iv-work-card-meta p { max-width: 22rem; margin: 0 0 1rem; color: var(--iv-muted); font-size: .82rem; line-height: 1.5; }
      .iv-work-card-meta strong { color: var(--iv-white); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; }
      .iv-work-card-meta strong b { color: var(--iv-orange); font-size: 1rem; font-weight: 400; }

      /* ===== SMM ===== */
      .iv-smm { min-height: 88svh; border-top: 1px solid var(--iv-line); padding: 8rem 4.8vw 7rem; box-sizing: border-box; }
      .iv-smm-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 7vw; align-items: center; min-height: 62vh; }
      .iv-smm-grid h2 { margin: 0; font-size: clamp(3rem, 6vw, 7rem); line-height: .75; letter-spacing: -.09em; font-weight: 400; text-transform: uppercase; }
      .iv-smm-grid h2 span { display: block; }
      .iv-smm-grid h2 span:last-child { color: var(--iv-orange); }
      .iv-smm-copy { max-width: 28rem; }
      .iv-smm-copy p { margin: 0 0 3rem; color: var(--iv-muted); font-size: .9rem; line-height: 1.6; }
      .iv-smm-copy ol { list-style: none; margin: 0 0 3rem; padding: 0; display: flex; flex-direction: column; }
      .iv-smm-copy li { display: flex; gap: 1rem; align-items: center; border-top: 1px solid var(--iv-line); padding: 1rem 0; font-size: .8rem; text-transform: uppercase; }
      .iv-smm-copy li:last-child { border-bottom: 1px solid var(--iv-line); }
      .iv-smm-copy li span { color: var(--iv-orange); font-size: .65rem; }
      .iv-smm-copy li b { font-weight: 500; }
      .iv-smm-orbit { display: grid; place-items: center; width: min(22vw, 15rem); aspect-ratio: 1; margin: 3rem 0 0 auto; border: 1px solid rgba(255,57,12,.7); border-radius: 50%; color: var(--iv-white); transform: rotate(-12deg); }
      .iv-smm-orbit span { color: var(--iv-orange); font-family: 'Geist', sans-serif; font-size: 2rem; }
      .iv-smm-orbit b { margin-top: -1.5rem; font-size: .58rem; letter-spacing: .16em; line-height: 1.2; text-align: center; text-transform: uppercase; }

      /* ===== SERVICES ===== */
      .iv-services { border-top: 1px solid var(--iv-line); padding: 8rem 4.8vw; }
      .iv-services-header { display: flex; justify-content: space-between; align-items: end; gap: 4rem; margin-bottom: 4rem; }
      .iv-services-header h2 { max-width: 48rem; margin: 0; font-size: clamp(2.3rem, 4.8vw, 5.8rem); line-height: .76; letter-spacing: -.09em; font-weight: 400; text-transform: uppercase; }
      .iv-services-header p { max-width: 22rem; margin: 0; color: var(--iv-muted); font-size: .95rem; line-height: 1.55; }
      .iv-services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
      .iv-service-card { min-height: 18rem; border: 1px solid var(--iv-line); padding: 1.5rem; background: rgba(246,246,246,.02); color: var(--iv-white); text-align: left; cursor: pointer; transition: border-color .3s ease, background .3s ease, transform .3s ease; display: flex; flex-direction: column; }
      .iv-service-card:hover { border-color: var(--iv-orange); background: rgba(255,57,12,.07); transform: translateY(-.25rem); }
      .iv-service-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: auto; }
      .iv-service-number { color: var(--iv-orange); font-size: .68rem; font-weight: 700; }
      .iv-service-card b { color: var(--iv-orange); font-size: 1.15rem; font-weight: 400; }
      .iv-service-card h3 { max-width: 20rem; margin: 2rem 0 .8rem; font-size: clamp(1.4rem, 2.3vw, 2.7rem); line-height: .95; font-weight: 400; text-transform: uppercase; }
      .iv-service-card p { max-width: 22rem; margin: 0 0 1.8rem; color: var(--iv-muted); font-size: .82rem; line-height: 1.55; }
      .iv-service-card-footer { color: var(--iv-white); font-size: .58rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }

      /* ===== PROOF / IMPACT ===== */
      .iv-proof { background: var(--iv-black); color: var(--iv-white); padding: 8rem 4.8vw; }
      .iv-proof-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 6vw; align-items: end; margin: 6rem 0 7rem; }
      .iv-proof-grid h2 { margin: 0; font-size: clamp(2.9rem, 5.4vw, 6.5rem); line-height: .76; letter-spacing: -.09em; font-weight: 400; text-transform: uppercase; }
      .iv-proof-grid h2 span { display: block; }
      .iv-proof-grid h2 span:last-child { color: var(--iv-orange); }
      .iv-proof-grid p { max-width: 23rem; margin: 0; color: var(--iv-muted); font-size: 1rem; line-height: 1.6; }
      .iv-proof-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; border-top: 1px solid var(--iv-line); padding-top: 1.5rem; }
      .iv-proof-stats div { min-height: 9rem; border-right: 1px solid var(--iv-line); padding-right: 1rem; }
      .iv-proof-stats div:last-child { border-right: 0; }
      .iv-proof-stats strong { display: block; margin-bottom: 1rem; color: var(--iv-orange); font-family: 'Geist', sans-serif; font-size: clamp(3rem, 6vw, 7rem); font-weight: 400; line-height: 1; }
      .iv-proof-stats span { color: var(--iv-muted); font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

      /* ===== FAQ ===== */
      .iv-faq { border-top: 1px solid var(--iv-line); padding: 8rem 4.8vw; }
      .iv-faq-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: 7vw; margin-top: 5rem; }
      .iv-faq-grid h2 { margin: 0 0 1.5rem; font-size: clamp(2.2rem, 4.5vw, 5.4rem); line-height: .76; letter-spacing: -.08em; font-weight: 400; text-transform: uppercase; }
      .iv-faq-grid h2 span { display: block; }
      .iv-faq-grid h2 span:last-child { color: var(--iv-orange); }
      .iv-faq-grid p { max-width: 22rem; margin: 0; color: var(--iv-muted); font-size: 1rem; line-height: 1.6; }
      .iv-faq-list { display: flex; flex-direction: column; }
      .iv-faq-list article { border-bottom: 1px solid var(--iv-line); }
      .iv-faq-list button { width: 100%; border: 0; padding: 1.5rem 0; background: transparent; color: var(--iv-white); font: inherit; font-size: .95rem; font-weight: 500; text-align: left; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
      .iv-faq-list button b { color: var(--iv-orange); font-size: 1.35rem; font-weight: 300; }
      .iv-faq-list p { padding: 0 2rem 1.5rem 0; margin: 0; color: var(--iv-muted); font-size: .88rem; line-height: 1.65; }

      /* ===== CONTACT ===== */
      .iv-contact { border-top: 1px solid var(--iv-line); padding: 8rem 4.8vw; }
      .iv-contact-heading { margin-bottom: 5rem; }
      .iv-contact-heading h2 { margin: 0 0 2rem; font-size: clamp(2.3rem, 4.8vw, 5.8rem); line-height: .76; letter-spacing: -.09em; font-weight: 400; text-transform: uppercase; }
      .iv-contact-heading h2 span { display: block; }
      .iv-contact-heading h2 span:last-child { color: var(--iv-orange); }
      .iv-contact-heading p { max-width: 32rem; margin: 0; color: var(--iv-muted); font-size: 1rem; line-height: 1.6; }
      .iv-contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; border-top: 1px solid var(--iv-line); padding-top: 2rem; }
      .iv-contact-grid span { display: block; margin-bottom: 1.2rem; color: var(--iv-muted); font-size: .62rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
      .iv-contact-grid a { display: block; color: var(--iv-white); font-size: clamp(1rem, 1.3vw, 1.45rem); font-weight: 400; text-decoration: none; margin-bottom: .5rem; transition: color .3s ease; }
      .iv-contact-grid a:hover { color: var(--iv-orange); }
      .iv-contact-socials { display: flex; flex-wrap: wrap; gap: 1.5rem; }
      .iv-contact-socials a { font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--iv-muted); }
      .iv-contact-socials a:hover { color: var(--iv-white); }

      /* ===== HEADER & FOOTER ===== */
      .iv-header { position: fixed; top: 1rem; right: clamp(1rem, 4vw, 4.5rem); left: clamp(1rem, 4vw, 4.5rem); z-index: 100; max-width: 118rem; margin: 0 auto; border: 1px solid rgba(246,246,246,.32); border-radius: 999px; background: rgba(15,18,19,.34); transition: background .35s ease, border-color .35s ease, transform .35s ease; }
      .iv-header.is-scrolled { background: rgba(15,18,19,.82); border-color: rgba(246,246,246,.28); backdrop-filter: blur(16px); }
      .iv-header-inner { width: 100%; height: 4rem; display: flex; align-items: center; gap: 1.2rem; padding: .35rem .55rem .35rem .75rem; box-sizing: border-box; }
      .iv-logo { display: inline-flex; align-items: center; flex: 0 0 auto; margin-left: 0; padding: .5rem .65rem; }
      .iv-logo img { width: 5.6rem; height: auto; display: block; filter: none; }
      .iv-nav { display: flex; align-items: center; gap: clamp(1rem, 1.8vw, 2rem); margin-left: auto; }
      .iv-nav a { color: var(--iv-muted); font-size: .58rem; font-weight: 600; letter-spacing: .1em; text-decoration: none; text-transform: uppercase; transition: color .25s ease; }
      .iv-nav a:hover { color: var(--iv-white); }
      .iv-header-cta { display: inline-flex; align-items: center; gap: .45rem; flex: 0 0 auto; border: 0; border-radius: 999px; padding: .72rem 1.05rem; background: var(--iv-white); color: var(--iv-black); font: inherit; font-size: .56rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
      .iv-header-cta b { font-size: .95rem; font-weight: 400; }
      .iv-menu-button { display: none; width: 2.7rem; height: 2.7rem; border: 1px solid rgba(246,246,246,.45); border-radius: 50%; background: rgba(15,18,19,.3); cursor: pointer; }
      .iv-menu-button span { display: block; width: 1rem; height: 1px; margin: .25rem auto; background: var(--iv-white); transition: transform .25s ease; }
      .iv-menu-button.is-open span:first-child { transform: translateY(.25rem) rotate(45deg); }
      .iv-menu-button.is-open span:last-child { transform: translateY(-.25rem) rotate(-45deg); }
      .iv-mobile-menu { position: fixed; inset: .7rem; z-index: 90; display: none; padding: 7rem 1.2rem 2rem; border: 1px solid rgba(246,246,246,.25); border-radius: 1.4rem; background: rgba(15,18,19,.98); }
      .iv-mobile-menu.is-open { display: block; }
      .iv-mobile-menu nav { display: flex; flex-direction: column; gap: 1.2rem; }
      .iv-mobile-menu a, .iv-mobile-menu button { color: var(--iv-white); font: inherit; font-family: 'Geist', sans-serif; font-size: clamp(2.6rem, 12vw, 5rem); font-weight: 500; letter-spacing: -.06em; line-height: .9; text-decoration: none; text-transform: uppercase; text-align: left; }
      .iv-mobile-menu button { border: 0; padding: 1.5rem 0 0; background: transparent; color: var(--iv-magenta); cursor: pointer; }

      .pipam-header { background: transparent !important; border-bottom: 1px solid transparent; transition: all 0.4s ease; }
      .pipam-header.is-scrolled { background: rgba(15,18,19,0.85) !important; backdrop-filter: blur(12px); border-bottom-color: var(--iv-line); }
      .pipam-header-inner { max-width: none; padding: 0 4.8vw; height: 5.5rem; }
      .logo-img { height: 1.6rem; }
      .pipam-nav a { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--iv-muted) !important; }
      .pipam-nav a:hover { color: var(--iv-white) !important; }
      .pipam-header-cta { background: var(--iv-magenta) !important; border-radius: 0 !important; padding: 0.8rem 1.4rem !important; font-size: 0.65rem !important; font-weight: 700 !important; }

      .site-footer { background: var(--iv-black); border-top: 1px solid var(--iv-line); padding: 4rem 4.8vw 2rem; }
      .site-footer-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4rem; }
      .site-footer-logo { height: 1.4rem; margin: .25rem 0 1.6rem .15rem; }
      .site-footer-top p { color: var(--iv-muted); font-size: 0.85rem; max-width: 20rem; }
      .site-footer-talk { font-family: 'Geist', sans-serif; font-size: clamp(2rem, 5vw, 5rem); color: var(--iv-white) !important; text-decoration: none; text-transform: uppercase; line-height: 0.9; }
      .site-footer-talk:hover { color: var(--iv-magenta) !important; }
      .site-footer-contact { display: flex; flex-wrap: wrap; gap: 3rem; margin-bottom: 4rem; font-size: 0.9rem; font-weight: 600; }
      .site-footer-contact a { color: var(--iv-white) !important; text-decoration: none; }
      .site-footer-socials { display: flex; gap: 1.5rem; margin-left: auto; }
      .site-footer-socials a { color: var(--iv-muted) !important; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
      .site-footer-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--iv-line); padding-top: 2rem; color: var(--iv-muted); font-size: 0.65rem; }
      .site-footer-bottom button { background: transparent; border: 0; color: inherit; font: inherit; cursor: pointer; margin-left: 1.5rem; }

      /* ===== MOBILE OVERRIDES ===== */
      @media (max-width: 1024px) {
        .iv-nav { display: none; }
        .iv-header-inner { height: 4.2rem; padding: 0 .7rem; gap: .5rem; }
        .iv-logo { margin-left: 0; padding: .4rem .5rem; }
        .iv-logo img { width: 4.7rem; }
        .iv-header-cta { margin-left: auto; padding: .62rem .72rem; font-size: .5rem; }
        .iv-menu-button { display: block; flex: 0 0 auto; }
        .iv-about-grid, .iv-smm-grid, .iv-proof-grid, .iv-faq-grid { grid-template-columns: 1fr; gap: 3rem; }
        .iv-about-grid { padding: 4.5rem 1.15rem 3.5rem; }
        .iv-work-scene-sticky { padding: 6rem 1.15rem 3.5rem; }
        .iv-work-scene-heading { grid-template-columns: 1fr; gap: 1.5rem; margin: 3rem 0 2rem; }
        .iv-work-scene-heading h2 { font-size: clamp(2.7rem, 12vw, 4.8rem); }
        .iv-work-scene-intro { max-width: 19rem; }
        .iv-work-scene-intro p { font-size: .8rem; }
        .iv-work-marquee { margin-left: -1.15rem; width: calc(100% + 2.3rem); }
        .iv-work-marquee-set { gap: .8rem; }
        .iv-work-fixed-card { flex-basis: clamp(15rem, 72vw, 22rem); }
        .iv-work-float-media { aspect-ratio: 16 / 10; border-radius: .5rem; }
        .iv-work-float-bar { height: 1.3rem; padding: 0 .4rem; }
        .iv-work-float-bar small { font-size: .32rem; }
        .iv-work-float-meta { padding-top: .5rem; }
        .iv-work-float-meta strong { font-size: .82rem; }
        .iv-work-float-meta > span, .iv-work-float-meta small { font-size: .38rem; }
        .iv-work-scene-footer { gap: .6rem; margin-top: 2.5rem; font-size: .46rem; }
        .iv-work-simple { padding: 6rem 1.15rem; }
        .iv-work-simple-heading { grid-template-columns: 1fr; gap: 2.5rem; margin: 3.5rem 0; }
        .iv-work-simple-heading h2 { font-size: clamp(2.8rem, 12vw, 5.2rem); }
        .iv-work-simple-heading h2 span:last-child { white-space: normal; }
        .iv-work-simple-grid { grid-template-columns: 1fr; gap: 0; }
        .iv-work-card.is-featured .iv-work-card-media { aspect-ratio: 1 / 1.08; }
        .iv-hero-top { padding: 6rem 1.15rem 0; }
        .iv-hero-date { display: none; }
        .iv-hero-main { padding: 1.4rem 1.15rem 1.2rem; }
        .iv-hero-title-wrap h1 { font-size: clamp(2.8rem, 13.2vw, 5.6rem); line-height: .78; }
        .iv-hero-title-wrap h1 span:nth-child(2) { margin-left: 7vw; }
        .iv-hero-middle-copy { display: none; }
        .iv-hero-shade { background: linear-gradient(90deg, rgba(8,9,9,.28) 0%, rgba(8,9,9,.04) 65%, rgba(8,9,9,.2) 100%), linear-gradient(0deg, rgba(8,9,9,.46), rgba(8,9,9,.02) 62%, rgba(8,9,9,.2)); }
        .iv-hero-footer { display: grid; grid-template-columns: 1fr; gap: 1.4rem; padding-top: 3rem; }
        .iv-hero-actions { flex-direction: row; align-items: center; gap: .45rem; }
        .iv-hero-cta, .iv-hero-scroll { min-height: 2.5rem; padding: 0 .75rem; font-size: .5rem; }
        .iv-hero-signature { align-self: flex-start; gap: .55rem; padding-bottom: 0; font-size: .44rem; }
        .iv-about-side { order: -1; }
        .iv-about-trust { grid-template-columns: 1fr; gap: 2rem; padding-bottom: 3rem; }
        .iv-smm { min-height: auto; padding: 6rem 1.15rem; }
        .iv-smm-grid { min-height: auto; gap: 3.5rem; }
        .iv-smm-grid h2 { font-size: clamp(3rem, 12.5vw, 5.4rem); }
        .iv-smm-orbit { width: 10rem; margin: 2rem 0 0 auto; }
        .iv-services { padding: 6rem 1.15rem; }
        .iv-services-header { display: block; margin-bottom: 3rem; }
        .iv-services-header p { margin-top: 2rem; }
        .iv-services-grid { grid-template-columns: 1fr; }
        .iv-service-card { min-height: 14rem; }
        .iv-proof { padding: 6rem 1.15rem; }
        .iv-proof-grid { margin: 4rem 0; }
        .iv-proof-grid h2 { font-size: clamp(3rem, 12.5vw, 5.4rem); }
        .iv-proof-stats { grid-template-columns: 1fr; gap: 0; }
        .iv-proof-stats div { min-height: auto; border-right: 0; border-bottom: 1px solid var(--iv-line); padding: 1.5rem 0; }
        .iv-proof-stats div:last-child { border-bottom: 0; }
        .iv-faq, .iv-contact { padding: 6rem 1.15rem; }
        .iv-faq-grid { margin-top: 3rem; gap: 3rem; }
        .iv-contact-heading { margin-bottom: 3rem; }
        .iv-about-mosaic { grid-template-columns: repeat(2, 1fr); gap: .7rem; padding: 0 1.15rem 5rem; }
        .iv-about-mosaic-small { height: 12rem; }
        .iv-about-mosaic-large { height: 24rem; }
        .iv-about-mosaic-medium { height: 18rem; }
        .iv-about-mosaic-large { grid-row: span 2; }
        .iv-about-orbit { position: relative; width: 60%; margin: 0 auto 3rem; }
        .iv-proof-stats { grid-template-columns: 1fr; gap: 2.5rem; }
        .iv-contact-grid { grid-template-columns: 1fr; gap: 3rem; }
        .site-footer-top { flex-direction: column; gap: 3rem; }
        .site-footer-socials { margin-left: 0; }
      }

      /* ===== ANIMATIONS ===== */
      .iv-hero-title-wrap h1 span { opacity: 0; transform: translateY(2rem); }
      .is-visible .iv-hero-title-wrap h1 span { animation: iv-fade-up .8s cubic-bezier(.23,1,.32,1) both; }
      .is-visible .iv-hero-title-wrap h1 span:nth-child(2) { animation-delay: .08s; }
      .is-visible .iv-hero-title-wrap h1 span:nth-child(3) { animation-delay: .16s; }
      .iv-about-mosaic figure, .iv-service-card { transition: transform .35s cubic-bezier(.23,1,.32,1), border-color .35s ease, background .35s ease; }
      @keyframes iv-fade-up { from { opacity: 0; transform: translateY(2rem); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .iv-work-marquee-track { animation: none; transform: translateX(0); }

        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        .iv-hero-title-wrap h1 span { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
