    <!-- ===== STYLES ===== -->
    <style>
      :root { color-scheme: light dark; }
      
      html.dark body {
        background: radial-gradient(ellipse at top right, #284B9B 0%, #10285A 42%, #050A1F 100%);
        background-attachment: fixed;
        color: #FFFFFF;
      }
      
      html:not(.dark) body {
        background: radial-gradient(ellipse at top right, rgba(36, 87, 255, 0.08) 0%, #F6F8FC 42%, #FFFFFF 100%);
        background-attachment: fixed;
        color: #0B1B3A;
      }

      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        padding-bottom: env(safe-area-inset-bottom);
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      
      .perspective-stage { perspective: 2000px; }
      .layer-3d { transform-style: preserve-3d; }

      .sketch-badge {
        border: 2px solid #2457FF;
        padding: 4px 12px;
        transform: rotate(-2deg);
        display: inline-block;
        font-size: 0.65rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #2457FF;
        background: rgba(36, 87, 255, 0.06);
      }

      .btn-ivision {
        background-color: #2457FF;
        color: #FFFFFF;
        font-weight: 800;
        padding: 0.75rem 1.75rem;
        border-radius: 12px;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.7rem;
        transform-style: preserve-3d;
      }

      @media (min-width: 768px) {
        .btn-ivision {
          padding: 0.8rem 2rem;
          font-size: 0.75rem;
          gap: 0.75rem;
        }
      }
      
      .btn-ivision:hover {
        transform: translateY(-4px) translateZ(10px);
        box-shadow: 0 20px 40px rgba(36, 87, 255, 0.3);
      }

      html:not(.dark) .logo-img {
        filter: invert(1) brightness(0.1) contrast(2);
      }

      .glass-card {
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        transform-style: preserve-3d;
      }

      html.dark .glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      html:not(.dark) .glass-card {
        background: rgba(36, 87, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(36, 87, 255, 0.12);
        box-shadow: 0 18px 45px rgba(11, 27, 58, 0.08);
      }

      @media (min-width: 768px) {
        .glass-card { border-radius: 24px; }
        .glass-card:hover {
          transform: translateY(-8px) rotateX(2deg) rotateY(2deg);
        }
        html.dark .glass-card:hover {
            border-color: rgba(36, 87, 255, 0.45);
            background: rgba(36, 87, 255, 0.06);
        }
        html:not(.dark) .glass-card:hover {
            border-color: rgba(36, 87, 255, 0.35);
            background: rgba(36, 87, 255, 0.06);
            box-shadow: 0 30px 60px rgba(36, 87, 255, 0.12);
        }
      }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2457FF; border-radius: 10px; }
      
      /* ===== LOGOS BLANCS ===== */
      .logo-white {
        filter: brightness(0) invert(1);
        -webkit-filter: brightness(0) invert(1);
      }

      html:not(.dark) .logo-white {
        filter: brightness(0);
        -webkit-filter: brightness(0);
      }

      /* ===== BANDE QUI DÉFILE ===== */
    @keyframes logoScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.logo-scroll-band {
  animation: logoScroll 20s linear infinite;
  width: max-content;
}

.logo-scroll-band:hover {
  animation-play-state: paused;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.animate-fade-in {
  animation: fadeIn 0.3s ease-out;
}
      /* ===== FADE IN MODAL ===== */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }

      /* ===== DARK MODE FIXES ===== */

      /* Badges et accents : contraste premium dans les deux modes */
      html.dark .sketch-badge {
        border-color: rgba(180, 198, 255, 0.7) !important;
        color: #F3F6FF !important;
        -webkit-text-fill-color: #F3F6FF !important;
        background: rgba(255,255,255,0.1) !important;
      }

      html:not(.dark) .sketch-badge {
        border-color: rgba(36, 87, 255, 0.45) !important;
        color: #2457FF !important;
        -webkit-text-fill-color: #2457FF !important;
        background: rgba(36, 87, 255, 0.06) !important;
      }

      /* uni-badge dark mode → blanc */
      html.dark .uni-badge {
        border-color: rgba(180, 198, 255, 0.7);
        color: #F3F6FF;
        background: rgba(255,255,255,0.1);
      }

      html:not(.dark) .uni-badge {
        border-color: rgba(36, 87, 255, 0.45);
        color: #2457FF;
        background: rgba(36, 87, 255, 0.06);
      }

      /* text-brand-blue dark mode → blanc */
      html.dark .text-brand-blue {
        color: #AFC0FF !important;
        -webkit-text-fill-color: #AFC0FF !important;
        background: none !important;
        background-clip: unset !important;
        -webkit-background-clip: unset !important;
      }

      /* text-brand-blue light mode → noir */
      html:not(.dark) .text-brand-blue {
        color: #2457FF !important;
        -webkit-text-fill-color: #2457FF !important;
        background: none !important;
        background-clip: unset !important;
        -webkit-background-clip: unset !important;
      }

      /* Boutons → toujours bleu/blanc */
      .btn-ivision,
      .btn-ivision .text-brand-blue {
        background: #2457FF !important;
        -webkit-text-fill-color: white !important;
        color: white !important;
      }

      /* Hover links */
      a.hover\:text-brand-blue:hover,
      .hover\:text-brand-blue:hover {
        -webkit-text-fill-color: #2457FF !important;
        color: #2457FF !important;
        background: none !important;
      }
    </style>
